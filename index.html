<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MonthEnd — Sovereign FinTech Survival Budget</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%22><text y=%2226%22 font-size=%2226%22>🛡️</text></svg>">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f1f5f9;
    }
    #topbar {
      height: 44px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
      position: relative;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
      color: #10b981;
    }
    .badge {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: #334155;
      color: #ffffff;
    }
    .btn-primary {
      background: #059669;
      border-color: #10b981;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #10b981;
    }
    #frame-container {
      width: 100%;
      height: calc(100% - 44px);
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: #0b0f19;
    }
    #loader {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0b0f19;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(16, 185, 129, 0.2);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      font-size: 14px;
      color: #94a3b8;
    }
    #url-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-box {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 480px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .modal-box h3 {
      font-size: 16px;
      margin-bottom: 8px;
      color: #f8fafc;
    }
    .modal-box p {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .modal-box input {
      width: 100%;
      padding: 10px 12px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #ffffff;
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
    }
    .modal-box input:focus {
      border-color: #10b981;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
  </style>
</head>
<body>

  <header id="topbar">
    <div class="brand">
      <span>🛡️ MONTHEND</span>
      <span class="badge">Sovereign FinTech</span>
    </div>
    <div class="actions">
      <button class="btn" onclick="openModal()">⚙️ Target URL</button>
      <a id="external-link" class="btn btn-primary" href="https://monthend.streamlit.app" target="_blank" rel="noopener">
        <span>↗ Open Full App</span>
      </a>
    </div>
  </header>

  <main id="frame-container">
    <div id="loader">
      <div class="spinner"></div>
      <div class="loading-text">Connecting to MonthEnd Sovereign FinTech...</div>
    </div>
    <iframe
      id="app-frame"
      src="https://monthend.streamlit.app/?embed=true"
      allow="clipboard-read; clipboard-write; geolocation"
      onload="hideLoader()">
    </iframe>
  </main>

  <div id="url-modal">
    <div class="modal-box">
      <h3>Configure Streamlit Target URL</h3>
      <p>Enter the public URL of your deployed Streamlit Community Cloud instance:</p>
      <input type="text" id="target-input" placeholder="https://monthend.streamlit.app" />
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveTargetUrl()">Save & Reload</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_URL = "https://monthend.streamlit.app";

    function getTargetUrl() {
      // Priority: query param ?src=, then localStorage, then default
      const params = new URLSearchParams(window.location.search);
      const urlParam = params.get("src");
      if (urlParam) return urlParam;
      return localStorage.getItem("monthend_target_url") || DEFAULT_URL;
    }

    function init() {
      let target = getTargetUrl().trim();
      if (!target.startsWith("http://") && !target.startsWith("https://")) {
        target = "https://" + target;
      }

      // Add ?embed=true for clean borderless display
      let embedUrl = target;
      if (!embedUrl.includes("embed=true")) {
        embedUrl += (embedUrl.includes("?") ? "&" : "?") + "embed=true";
      }

      const frame = document.getElementById("app-frame");
      const externalLink = document.getElementById("external-link");
      
      frame.src = embedUrl;
      externalLink.href = target;
      document.getElementById("target-input").value = target;

      // Fallback timer to hide loader if iframe event is blocked by cross-origin
      setTimeout(hideLoader, 4000);
    }

    function hideLoader() {
      const loader = document.getElementById("loader");
      if (loader) {
        loader.style.opacity = "0";
        setTimeout(() => { loader.style.display = "none"; }, 400);
      }
    }

    function openModal() {
      document.getElementById("url-modal").style.display = "flex";
      document.getElementById("target-input").focus();
    }

    function closeModal() {
      document.getElementById("url-modal").style.display = "none";
    }

    function saveTargetUrl() {
      let val = document.getElementById("target-input").value.trim();
      if (val) {
        if (!val.startsWith("http://") && !val.startsWith("https://")) {
          val = "https://" + val;
        }
        localStorage.setItem("monthend_target_url", val);
        closeModal();
        location.reload();
      }
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
