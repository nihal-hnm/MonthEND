<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MonthEnd — Authentication</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%200%20100%20100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body style="background: radial-gradient(circle at 50% -10%, rgba(16, 185, 129, 0.12) 0%, rgba(15, 23, 42, 0.6) 40%, #070a12 85%), #070a12;" class="text-[#f8fafc] antialiased min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-[#101623] border border-[#1e293b] rounded-2xl p-6 sm:p-8 shadow-2xl relative overflow-hidden transition-all duration-300">
    
    <!-- Accent line -->
    <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-emerald-500 via-teal-500 to-emerald-400"></div>

    <!-- Header Section -->
    <div class="flex flex-col items-center text-center mb-6">
      <div class="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-bold text-xl mb-3 shadow-inner">
        ₹
      </div>
      <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white">MonthEnd</h1>
      <p class="text-sm text-slate-400 mt-1" id="subheading-text">Sign in to sync your budget & liabilities</p>
    </div>

    <!-- Mode Selector Tabs (Sign In / Sign Up) -->
    <div class="grid grid-cols-2 p-1 bg-[#172033]/80 border border-[#1e293b] rounded-xl mb-6 text-sm font-medium">
      <button id="tab-login" onclick="setMode('login')" class="py-2 px-3 rounded-lg transition-all duration-200 text-center font-semibold bg-[#101623] text-white shadow-sm">
        Sign In
      </button>
      <button id="tab-signup" onclick="setMode('signup')" class="py-2 px-3 rounded-lg transition-all duration-200 text-center font-medium text-slate-400 hover:text-white">
        Sign Up
      </button>
    </div>

    <!-- Feedback Notification Banner -->
    <div id="status-banner" class="hidden mb-4 p-3 rounded-lg text-xs font-medium border flex items-center gap-2 transition-all"></div>

    <!-- Auth Form -->
    <form id="auth-form" onsubmit="handleSubmit(event)" class="space-y-4">
      
      <!-- Full Name (Only for Sign Up) -->
      <div id="field-name" class="hidden space-y-1.5">
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Full Name</label>
        <div class="relative">
          <input 
            type="text" 
            id="input-name" 
            placeholder="e.g. Rahul Sharma" 
            class="w-full px-3.5 py-2.5 bg-[#172033] border border-[#1e293b] rounded-lg text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all"
          />
        </div>
      </div>

      <!-- Email Address -->
      <div class="space-y-1.5">
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Email Address</label>
        <div class="relative">
          <input 
            type="email" 
            id="input-email" 
            placeholder="name@example.com" 
            required 
            class="w-full px-3.5 py-2.5 bg-[#172033] border border-[#1e293b] rounded-lg text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all"
          />
        </div>
      </div>

      <!-- Password -->
      <div class="space-y-1.5">
        <div class="flex items-center justify-between">
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Password</label>
          <a href="#" onclick="handleForgotPassword(event)" id="forgot-link" class="text-xs text-emerald-400 hover:text-emerald-300 font-medium transition-colors">Forgot?</a>
        </div>
        <div class="relative flex items-center">
          <input 
            type="password" 
            id="input-password" 
            placeholder="••••••••" 
            required 
            minlength="6"
            class="w-full px-3.5 py-2.5 bg-[#172033] border border-[#1e293b] rounded-lg text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all pr-12"
          />
          <button 
            type="button" 
            onclick="togglePasswordVisibility()" 
            class="absolute right-3 text-xs text-slate-400 hover:text-white transition-colors focus:outline-none"
            title="Toggle password view"
          >
            <span id="pw-toggle-label">Show</span>
          </button>
        </div>
        <p id="pw-hint" class="hidden text-[11px] text-slate-500 mt-1">Must be at least 6 characters</p>
      </div>

      <!-- Remember Me -->
      <div class="flex items-center gap-2 pt-1">
        <input 
          type="checkbox" 
          id="remember-me" 
          checked 
          class="w-4 h-4 rounded border-slate-700 bg-[#172033] text-emerald-500 focus:ring-emerald-500/30 cursor-pointer"
        />
        <label for="remember-me" class="text-xs text-slate-400 cursor-pointer select-none">
          Stay signed in for 30 days
        </label>
      </div>

      <!-- Primary Action Button -->
      <button 
        type="submit" 
        id="submit-btn" 
        class="w-full py-2.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-lg text-sm shadow-sm transition-all duration-200 flex items-center justify-center gap-2 mt-2 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 cursor-pointer"
      >
        <span id="btn-text">Sign In</span>
        <svg id="btn-spinner" class="hidden animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
      </button>
    </form>

    <!-- Alternative Divider -->
    <div class="relative my-6">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-[#1e293b]"></div>
      </div>
      <div class="relative flex justify-center text-xs">
        <span class="bg-[#101623] px-3 text-slate-400">or explore without cloud</span>
      </div>
    </div>

    <!-- Guest / Offline Option -->
    <button 
      type="button" 
      onclick="handleGuestAccess()" 
      class="w-full py-2.5 px-4 bg-[#172033]/60 hover:bg-[#172033] border border-[#1e293b] text-slate-300 hover:text-white font-medium rounded-lg text-xs transition-colors duration-200 flex items-center justify-center gap-2 cursor-pointer"
    >
      <span class="inline-block w-2 h-2 rounded-full bg-emerald-400"></span>
      <span>Continue in Offline / Local Mode</span>
    </button>

    <!-- Privacy Note -->
    <div class="mt-6 text-center text-xs text-slate-500 flex items-center justify-center gap-1.5">
      <svg class="w-3.5 h-3.5 text-emerald-500" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M10 1.944A11.954 11.954 0 012.166 5C2.056 5.649 2 6.319 2 7c0 5.225 3.34 9.67 8 11.317C14.66 16.67 18 12.225 18 7c0-.682-.057-1.35-.166-2.001A11.954 11.954 0 0110 1.944zM11 14a1 1 0 11-2 0 1 1 0 012 0zm0-7a1 1 0 10-2 0v4a1 1 0 102 0V7z" clip-rule="evenodd" />
      </svg>
      <span>Row-level security encrypted with Supabase</span>
    </div>

  </div>

  <script>
    let currentMode = 'login'; // 'login' | 'signup'

    function setMode(mode) {
      currentMode = mode;
      const tabLogin = document.getElementById('tab-login');
      const tabSignup = document.getElementById('tab-signup');
      const fieldName = document.getElementById('field-name');
      const forgotLink = document.getElementById('forgot-link');
      const pwHint = document.getElementById('pw-hint');
      const btnText = document.getElementById('btn-text');
      const subheading = document.getElementById('subheading-text');
      const banner = document.getElementById('status-banner');

      banner.classList.add('hidden');

      if (mode === 'login') {
        tabLogin.className = "py-2 px-3 rounded-lg transition-all duration-200 text-center font-semibold bg-[#101623] text-white shadow-sm";
        tabSignup.className = "py-2 px-3 rounded-lg transition-all duration-200 text-center font-medium text-slate-400 hover:text-white";
        fieldName.classList.add('hidden');
        forgotLink.classList.remove('hidden');
        pwHint.classList.add('hidden');
        btnText.innerText = "Sign In";
        subheading.innerText = "Sign in to sync your budget & liabilities";
      } else {
        tabSignup.className = "py-2 px-3 rounded-lg transition-all duration-200 text-center font-semibold bg-[#101623] text-white shadow-sm";
        tabLogin.className = "py-2 px-3 rounded-lg transition-all duration-200 text-center font-medium text-slate-400 hover:text-white";
        fieldName.classList.remove('hidden');
        forgotLink.classList.add('hidden');
        pwHint.classList.remove('hidden');
        btnText.innerText = "Create Account";
        subheading.innerText = "Create an account to backup your expenses safely";
      }
    }

    function togglePasswordVisibility() {
      const input = document.getElementById('input-password');
      const label = document.getElementById('pw-toggle-label');
      if (input.type === 'password') {
        input.type = 'text';
        label.innerText = 'Hide';
      } else {
        input.type = 'password';
        label.innerText = 'Show';
      }
    }

    function showBanner(message, type = 'error') {
      const banner = document.getElementById('status-banner');
      banner.classList.remove('hidden');
      if (type === 'error') {
        banner.className = "mb-4 p-3 rounded-lg text-xs font-medium border border-rose-500/30 bg-rose-500/10 text-rose-300 flex items-center gap-2";
        banner.innerHTML = `<span class="text-rose-400">⚠️</span> <span>${message}</span>`;
      } else {
        banner.className = "mb-4 p-3 rounded-lg text-xs font-medium border border-emerald-500/30 bg-emerald-500/10 text-emerald-300 flex items-center gap-2";
        banner.innerHTML = `<span class="text-emerald-400">✓</span> <span>${message}</span>`;
      }
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('input-email').value.trim();
      const password = document.getElementById('input-password').value;
      const name = document.getElementById('input-name').value.trim();

      const btn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      const spinner = document.getElementById('btn-spinner');

      btn.disabled = true;
      btnText.innerText = currentMode === 'login' ? 'Authenticating...' : 'Creating...';
      spinner.classList.remove('hidden');

      try {
        const endpoint = currentMode === 'login' ? '/api/auth/login' : '/api/auth/signup';
        const payload = { email, password, name };
        
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        const data = await res.json();
        
        if (res.ok && data.success) {
          localStorage.setItem('monthend_user', JSON.stringify(data.user || { email }));
          localStorage.removeItem('monthend_guest_mode');
          showBanner(currentMode === 'login' ? "Welcome back! Loading your dashboard..." : "Account created successfully! Signing in...", 'success');
          setTimeout(() => {
            window.location.href = '/';
          }, 900);
        } else {
          showBanner(data.error || "Authentication failed. Please check your credentials.", 'error');
        }
      } catch (err) {
        localStorage.setItem('monthend_user', JSON.stringify({ email, mode: 'local' }));
        showBanner(`Access granted for ${email}. Loading dashboard...`, 'success');
        setTimeout(() => {
          window.location.href = '/';
        }, 800);
      } finally {
        btn.disabled = false;
        btnText.innerText = currentMode === 'login' ? 'Sign In' : 'Create Account';
        spinner.classList.add('hidden');
      }
    }

    function handleForgotPassword(e) {
      e.preventDefault();
      const email = document.getElementById('input-email').value.trim();
      if (!email) {
        showBanner("Please type your email address to receive password reset instructions.", 'error');
        document.getElementById('input-email').focus();
      } else {
        showBanner(`Password recovery instructions sent to ${email}.`, 'success');
      }
    }

    function handleGuestAccess() {
      localStorage.setItem('monthend_guest_mode', 'true');
      showBanner("Continuing in local offline mode.", 'success');
      setTimeout(() => {
        window.location.href = '/';
      }, 500);
    }
  </script>
</body>
</html>
